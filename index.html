<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<title>RISC-V 指令集乱序处理器设计 · 毕业答辩</title>

	<link rel="icon" type="image/png" href="public/hit-logo.png" />
	<link rel="stylesheet" href="dist/reset.css" />
	<link rel="stylesheet" href="dist/reveal.css" />
	<link rel="stylesheet" href="dist/theme/white.css" />
	<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />
	<link rel="stylesheet" href="css/presentation.css" />
</head>

<body>
	<div class="reveal">
		<div class="slides">
			<section>
				<h2>正在加载…</h2>
			</section>
		</div>
	</div>

	<script type="module">
		// 按顺序异步加载各章节的 HTML 片段，拼装到 .slides 容器中，再初始化 reveal.js
		import Reveal from './dist/reveal.mjs';
		import RevealHighlight from './dist/plugin/highlight.mjs';
		import RevealNotes from './dist/plugin/notes.mjs';
		// Use CDN ESM so GitHub Pages can run without bundling.
		import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

		const SLIDE_FILES = [
			'slides/01-intro.html',
			'slides/02-soc.html',
			'slides/03-ipcore.html',
			'slides/04-decouple.html',
			'slides/05-frontend.html',
			'slides/06-backend.html',
			'slides/07-priv.html',
			'slides/08-cache.html',
			'slides/09-simulation.html',
			'slides/10-perf.html',
			'slides/11-os.html',
			'slides/12-engineering.html',
			'slides/13-summary.html',
			'slides/14-thanks.html',
		];

		async function loadSlides() {
			const container = document.querySelector('.reveal .slides');
			const fragments = await Promise.all(
				SLIDE_FILES.map(async (path) => {
					const resp = await fetch(path);
					if (!resp.ok) throw new Error(`Failed to fetch ${path}: ${resp.status}`);
					return resp.text();
				}),
			);
			container.innerHTML = fragments.join('\n');
		}

		mermaid.initialize({
			startOnLoad: false,
			theme: 'default',
			securityLevel: 'loose',
			flowchart: { htmlLabels: true, curve: 'basis' },
			themeVariables: {
				fontSize: '14px',
				primaryColor: '#ebf5fb',
				primaryTextColor: '#2c3e50',
				primaryBorderColor: '#2980b9',
				lineColor: '#555',
			},
		});

		async function renderMermaid(scope = document) {
			const blocks = scope.querySelectorAll('pre.mermaid:not([data-rendered])');
			for (const block of blocks) {
				const src = block.textContent.trim();
				const id = `mmd-${Math.random().toString(36).slice(2, 10)}`;
				try {
					const { svg } = await mermaid.render(id, src);
					block.innerHTML = svg;
					block.setAttribute('data-rendered', 'true');
				} catch (err) {
					console.error('Mermaid render error', err, src);
					block.innerHTML = `<pre style="color:#c0392b;font-size:0.55em;">${err.message}</pre>`;
				}
			}
		}

		await loadSlides();
		await renderMermaid();

		const deck = new Reveal({
			hash: true,
			slideNumber: 'c/t',
			width: 1280,
			height: 760,
			margin: 0.06,
			transition: 'slide',
			plugins: [RevealHighlight, RevealNotes],
		});

		await deck.initialize();
		// 部分图片或 mermaid 在加载后才计算好尺寸，强制刷新一次布局
		deck.on('slidechanged', () => renderMermaid());
		deck.layout();
	</script>
</body>

</html>
